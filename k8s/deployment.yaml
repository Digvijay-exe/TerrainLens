apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrainlens
  labels:
    app: terrainlens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terrainlens
  template:
    metadata:
      labels:
        app: terrainlens
    spec:
      containers:
        - name: terrainlens
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8501
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
